name: Snake

on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#33ccff&color_dots=#151b27,#0b4a5e,#0d7f9e,#1fb4d9,#5ff5c3&color_background=#0d1117
            dist/snake-light.svg?palette=github-light&color_snake=#0a8fd6&color_dots=#e6edf5,#bfe6f7,#74c9ee,#239fdc,#0aa46b
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
