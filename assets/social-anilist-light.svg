<svg xmlns="http://www.w3.org/2000/svg" width="42" height="42" viewBox="0 0 42 42" role="img" aria-label="AniList">
<title>AniList</title>
<defs>
<linearGradient id="hl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a8fd6"/><stop offset="1" stop-color="#0aa46b"/></linearGradient>
<linearGradient id="hlh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0a8fd6"/><stop offset="1" stop-color="#0aa46b"/></linearGradient>

